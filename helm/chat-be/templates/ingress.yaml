{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chat-be.fullname" . }}
  labels:
    {{- include "chat-be.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.group.name }}
    alb.ingress.kubernetes.io/group.order: {{ .Values.ingress.group.order | quote }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthCheckPath }}
    alb.ingress.kubernetes.io/target-group-attributes: >-
      deregistration_delay.timeout_seconds={{ .Values.ingress.targetGroup.deregistrationDelaySeconds }}
    {{- if .Values.ingress.group.isPrimary }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    {{- if .Values.ingress.tls.enabled }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.tls.certificateArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- end }}
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds={{ .Values.ingress.idleTimeoutSeconds }}
      {{- if .Values.ingress.accessLogs.enabled }},access_logs.s3.enabled=true,access_logs.s3.bucket={{ .Values.ingress.accessLogs.bucket }},access_logs.s3.prefix={{ .Values.ingress.accessLogs.prefix }}{{- end }}
    {{- if .Values.ingress.waf.enabled }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ .Values.ingress.waf.aclArn }}
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "chat-be.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- end }}