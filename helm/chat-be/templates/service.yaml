apiVersion: v1
kind: Service
metadata:
  name: {{ include "chat-be.fullname" . }}
  labels:
    {{- include "chat-be.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "chat-be.labels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      name: http
      targetPort: {{ .Values.containerPort }}
