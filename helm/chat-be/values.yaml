fullnameOverride: chat-be

replicaCount: 1

image:
  repository: aruna451/chat-be
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8001

containerPort: 8000

healthCheck:
  path: /health
  port: 8000

# In-cluster URL of the MCP server. Defaults to the mcp-server chart's
# service name when installed together via the umbrella chart.
mcpServerUrl: "http://mcp-server:8000"

existingSecret: app-secrets
createSecret: true

secrets:
  openaiApiKey: ""
  googleApiKey: ""
  openweatherApiKey: ""
  alphavantageApiKey: ""

env: []

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
