fullnameOverride: chat-be
replicaCount: 1
image:
  repository: 324037296112.dkr.ecr.us-east-1.amazonaws.com/chat-be
  tag: 9ecf0b5fc2f5
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8001
containerPort: 8000
healthCheck:
  path: /health
  port: 8000
# In-cluster URL of the MCP server. Defaults to the mcp-server chart's
# service name when installed together via the umbrella chart.
mcpServerUrl: "http://mcp-server:8000"
existingSecret: app-secrets
createSecret: false
secrets:
  openaiApiKey: ""
  googleApiKey: ""
  openweatherApiKey: ""
  alphavantageApiKey: ""
env: []
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
ingress:
  enabled: true
  className: alb
  group:
    name: chat-platform
    order: 10
    isPrimary: true
  host: null
  path: /api
  pathType: Prefix
  healthCheckPath: /health
  idleTimeoutSeconds: 180 # streaming/SSE responses from ai-agent need this raised from the 60s default
  targetGroup:
    deregistrationDelaySeconds: 30
  accessLogs:
    enabled: false # flip once the S3 bucket + ELB write policy exist
    bucket: ""
    prefix: "chat-platform-dev"
  waf:
    enabled: false # flip once a WAFv2 Web ACL is provisioned
    aclArn: ""
  tls:
    enabled: false
    certificateArn: ""
  annotations: {}
externalSecret:
  name: app-secrets
  enabled: true
  secretStoreName: aws-secretsmanager
  refs:
    - secretKey: OPENAI_API_KEY
      remoteKey: /tf-practice/dev/openai-api-key
      property: openai_api_key
    - secretKey: GOOGLE_API_KEY
      remoteKey: /tf-practice/dev/google-api-key
      property: google_api_key
    - secretKey: OPENWEATHER_API_KEY
      remoteKey: /tf-practice/dev/openweather-api-key
      property: openweather_api_key
    - secretKey: ALPHAVANTAGE_API_KEY
      remoteKey: /tf-practice/dev/alpha-vantage-api-key
      property: alpha_vantage_api_key
serviceMonitor:
  enabled: false # turn on after kube-prometheus-stack is installed
  release: kube-prom-stack
  portName: http
  path: /metrics
  interval: 15s
