[project]
name = "mcp-cal-server"
version = "1.0.0"
description = "Production MCP server exposing basic math tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14.2",
    "pydantic-settings>=2.5.0",
    # logging_config.py imports `pythonjsonlogger.json`, which exists from 3.1.0 onward
    "python-json-logger>=3.1.0",
    # main.py imports prometheus_client directly (Counter, Histogram, generate_latest)
    "prometheus-client>=0.20.0",
    # cross-platform process_* metrics (CPU, memory, open fds)
    "psutil>=5.9.0",
    "cryptography>=41.0.0,<42",
    # OpenTelemetry: trace_id/span_id in logs + W3C `traceparent` extraction.
    # Keep the sdk and instrumentation packages upgraded together.
    "opentelemetry-sdk>=1.44.0,<2",
    "opentelemetry-instrumentation-asgi>=0.65b0,<1",
    "opentelemetry-instrumentation-logging>=0.65b0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-cal-server = "app.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"