name: Reusable - Build, Push to ECR & Update Helm values

on:
  workflow_call:
    inputs:
      service_name:
        description: "Human-readable service name (used in logs/tags/commit messages)"
        required: true
        type: string
      context_path:
        description: "Path to the service's build context (folder containing the Dockerfile)"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile relative to repo root"
        required: true
        type: string
      ecr_repository:
        description: "Name of the ECR repository for this service"
        required: true
        type: string
      aws_region:
        description: "AWS region the ECR repository lives in"
        required: false
        type: string
        default: "us-east-1"
      helm_values_path:
        description: "Path (relative to repo root) to this service's Helm values.yaml"
        required: true
        type: string
      image_repository_key:
        description: "yq path to the image repository field in values.yaml"
        required: false
        type: string
        default: ".image.repository"
      image_tag_key:
        description: "yq path to the image tag field in values.yaml"
        required: false
        type: string
        default: ".image.tag"
      gitops_branch:
        description: "Branch ArgoCD tracks; the Helm values bump is committed here"
        required: true
        type: string
    secrets:
      AWS_ROLE_EKS_ARN:
        description: "IAM role ARN GitHub Actions will assume via OIDC"
        required: true

permissions:
  id-token: write
  contents: write
jobs:
  build-and-push:
    name: Build & Push ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.tags.outputs.image_repository }}
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NEW: debug step, add it here
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, ref, event_name}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_EKS_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ inputs.ecr_repository }}" \
            --region "${{ inputs.aws_region }}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${{ inputs.ecr_repository }}" \
            --region "${{ inputs.aws_region }}" \
            --image-scanning-configuration scanOnPush=true

      - name: Set image tags
        id: tags
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ inputs.ecr_repository }}"
          SHA_TAG="${GITHUB_SHA::12}"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image_repository=$REGISTRY/$REPO" >> "$GITHUB_OUTPUT"
          echo "image_sha=$REGISTRY/$REPO:$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### ${{ inputs.service_name }} pushed to ECR" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.image_sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  update-helm-values:
    name: Update Helm values for ${{ inputs.service_name }}
    needs: build-and-push
    runs-on: ubuntu-latest
    # Serializes commits to the GitOps branch across concurrent service workflows
    # (chat-be / chat-fe / mcp-server can all fire at once on a monorepo push) so
    # two jobs don't race to push and fail on a non-fast-forward error.
    concurrency:
      group: helm-values-${{ inputs.gitops_branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout GitOps branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gitops_branch }}
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo curl -sL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Bump image repository & tag in values.yaml
        run: |
          VALUES_FILE="${{ inputs.helm_values_path }}"
          test -f "$VALUES_FILE"   # fail fast with a clear error if the path is wrong

          yq -i '${{ inputs.image_repository_key }} = "${{ needs.build-and-push.outputs.image_repository }}"' "$VALUES_FILE"
          yq -i '${{ inputs.image_tag_key }} = "${{ needs.build-and-push.outputs.sha_tag }}"' "$VALUES_FILE"

          echo "### Updated $VALUES_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          cat "$VALUES_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit & push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          VALUES_FILE="${{ inputs.helm_values_path }}"
          git add "$VALUES_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit (tag already up to date)."
            exit 0
          fi

          git commit -m "chore(${{ inputs.service_name }}): deploy ${{ needs.build-and-push.outputs.sha_tag }}"

          # Retry on push rejection: another service's job may have pushed to this
          # branch between our checkout and now. Rebase onto the latest and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"${{ inputs.gitops_branch }}"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest ${{ inputs.gitops_branch }}..."
            git fetch origin "${{ inputs.gitops_branch }}"
            git rebase "origin/${{ inputs.gitops_branch }}"
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push Helm values update after 5 attempts."
          exit 1
