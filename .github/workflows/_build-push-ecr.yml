name: Reusable - Build & Push to ECR

on:
  workflow_call:
    inputs:
      service_name:
        description: "Human-readable service name (used in logs/tags)"
        required: true
        type: string
      context_path:
        description: "Path to the service's build context (folder containing the Dockerfile)"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile relative to repo root"
        required: true
        type: string
      ecr_repository:
        description: "Name of the ECR repository for this service"
        required: true
        type: string
        default: "ai-agent-platform-prod"
      aws_region:
        description: "AWS region the ECR repository lives in"
        required: false
        type: string
        default: "us-east-1"
    secrets:
      AWS_ROLE_ARN:
        description: "IAM role ARN GitHub Actions will assume via OIDC"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC token
        run: |
          curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | \
            jq -R 'split(".") | .[1] | @base64d | fromjson'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ inputs.ecr_repository }}" \
            --region "${{ inputs.aws_region }}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${{ inputs.ecr_repository }}" \
            --region "${{ inputs.aws_region }}" \
            --image-scanning-configuration scanOnPush=true

      - name: Set image tags
        id: tags
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ inputs.ecr_repository }}"
          SHA_TAG="${GITHUB_SHA::12}"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image_sha=$REGISTRY/$REPO:$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image_latest=$REGISTRY/$REPO:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.image_sha }}
            ${{ steps.tags.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### ${{ inputs.service_name }} pushed to ECR" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.image_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.image_latest }}\`" >> "$GITHUB_STEP_SUMMARY"