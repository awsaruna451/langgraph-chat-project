name: Reusable - Build & Push to ECR

on:
  workflow_call:
    inputs:
      service_name:
        description: "Human-readable service name (used in logs/tags)"
        required: true
        type: string
      context_path:
        description: "Path to the service's build context (folder containing the Dockerfile)"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile relative to repo root"
        required: true
        type: string
      ecr_repository:
        description: "Name of the ECR repository for this service"
        required: true
        type: string
        default: "ai-agent-platform-prod"
      aws_region:
        description: "AWS region the ECR repository lives in"
        required: false
        type: string
        default: "us-east-1"
      environment:
        description: "Environment tag to target for deployment (e.g. prod)"
        required: true
        type: string
      container_port:
        description: "Port the container listens on internally"
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        description: "IAM role ARN GitHub Actions will assume via OIDC"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ inputs.ecr_repository }}" \
            --region "${{ inputs.aws_region }}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${{ inputs.ecr_repository }}" \
            --region "${{ inputs.aws_region }}" \
            --image-scanning-configuration scanOnPush=true

      - name: Set image tags
        id: tags
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ inputs.ecr_repository }}"
          SHA_TAG="${GITHUB_SHA::12}"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image_sha=$REGISTRY/$REPO:$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image_latest=$REGISTRY/$REPO:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.image_sha }}
            ${{ steps.tags.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### ${{ inputs.service_name }} pushed to ECR" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.image_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.image_latest }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy via SSM
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region "${{ inputs.aws_region }}" \
            --filters "Name=tag:Environment,Values=${{ inputs.environment }}" \
                      "Name=tag:ManagedBy,Values=terraform" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No running instances found to deploy to."
            exit 1
          fi

          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE="${REGISTRY}/${{ inputs.ecr_repository }}:${{ steps.tags.outputs.sha_tag }}"

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ inputs.aws_region }}" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=$(echo $INSTANCE_IDS | tr ' ' ',')" \
            --comment "Deploy ${{ inputs.service_name }}" \
            --parameters commands="[
              \"aws ecr get-login-password --region ${{ inputs.aws_region }} | docker login --username AWS --password-stdin ${REGISTRY}\",
              \"docker pull ${IMAGE}\",
              \"docker stop ${{ inputs.service_name }} || true\",
              \"docker rm ${{ inputs.service_name }} || true\",
              \"docker run -d --name ${{ inputs.service_name }} --restart unless-stopped -p ${{ inputs.container_port }}:${{ inputs.container_port }} ${IMAGE}\"
            ]" \
            --query "Command.CommandId" --output text)

          echo "Waiting for command $COMMAND_ID to finish..."
          aws ssm wait command-executed \
            --region "${{ inputs.aws_region }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "$(echo $INSTANCE_IDS | cut -d' ' -f1)" || true

          for id in $INSTANCE_IDS; do
            echo "--- Output for $id ---"
            aws ssm get-command-invocation \
              --region "${{ inputs.aws_region }}" \
              --command-id "$COMMAND_ID" \
              --instance-id "$id"
          done