name: Reusable - Build & Push to ECR

on:
  workflow_call:
    inputs:
      service_name:
        description: "Human-readable service name (used in logs/tags)"
        required: true
        type: string
      context_path:
        description: "Path to the service's build context (folder containing the Dockerfile)"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile relative to repo root"
        required: true
        type: string
      ecr_repository:
        description: "Name of the ECR repository for this service"
        required: true
        type: string
        default: "ai-agent-platform-dev"
      aws_region:
        description: "AWS region the ECR repository lives in"
        required: false
        type: string
        default: "us-east-1"
      environment:
        description: "Environment tag to target for deployment (e.g. dev)"
        required: true
        type: string
      container_port:
        description: "Port the container listens on internally"
        required: true
        type: string
      secret_name:
        description: "Secrets Manager secret name to inject as container env vars (optional — leave blank if the service needs none)"
        required: false
        type: string
        default: ""
    secrets:
      AWS_ROLE_ARN:
        description: "IAM role ARN GitHub Actions will assume via OIDC"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ inputs.ecr_repository }}" \
            --region "${{ inputs.aws_region }}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${{ inputs.ecr_repository }}" \
            --region "${{ inputs.aws_region }}" \
            --image-scanning-configuration scanOnPush=true

      - name: Set image tags
        id: tags
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ inputs.ecr_repository }}"
          SHA_TAG="${GITHUB_SHA::12}"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image_sha=$REGISTRY/$REPO:$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image_latest=$REGISTRY/$REPO:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### ${{ inputs.service_name }} pushed to ECR" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.image_sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy via SSM
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region "${{ inputs.aws_region }}" \
            --filters "Name=tag:Environment,Values=${{ inputs.environment }}" \
                      "Name=tag:ManagedBy,Values=terraform" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No running instances found to deploy to."
            exit 1
          fi

          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE="${REGISTRY}/${{ inputs.ecr_repository }}:${{ steps.tags.outputs.sha_tag }}"
          SECRET_NAME="${{ inputs.secret_name }}"

          cat > deploy.sh <<'SCRIPT_EOF'
          #!/bin/bash
          set -euxo pipefail
          aws ecr get-login-password --region "__AWS_REGION__" | docker login --username AWS --password-stdin "__REGISTRY__"
          docker pull "__IMAGE__"
          docker stop __SERVICE_NAME__ || true
          docker rm __SERVICE_NAME__ || true

          ENV_FLAGS=""
          if [ -n "__SECRET_NAME__" ]; then
            SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "__SECRET_NAME__" --region "__AWS_REGION__" --query SecretString --output text)
            ENV_FLAGS=$(echo "$SECRET_JSON" | jq -r 'to_entries | map("-e " + .key + "=" + (.value|@sh)) | join(" ")')
          fi

          eval docker run -d --name __SERVICE_NAME__ --restart unless-stopped -p __CONTAINER_PORT__:__CONTAINER_PORT__ $ENV_FLAGS "__IMAGE__"
          SCRIPT_EOF

          sed -i \
            -e "s#__AWS_REGION__#${{ inputs.aws_region }}#g" \
            -e "s#__REGISTRY__#${REGISTRY}#g" \
            -e "s#__IMAGE__#${IMAGE}#g" \
            -e "s#__SERVICE_NAME__#${{ inputs.service_name }}#g" \
            -e "s#__CONTAINER_PORT__#${{ inputs.container_port }}#g" \
            -e "s#__SECRET_NAME__#${SECRET_NAME}#g" \
            deploy.sh

          B64=$(base64 -w0 deploy.sh)

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ inputs.aws_region }}" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=$(echo $INSTANCE_IDS | tr ' ' ',')" \
            --comment "Deploy ${{ inputs.service_name }}" \
            --parameters commands="[\"echo ${B64} | base64 -d > /tmp/deploy.sh\", \"chmod +x /tmp/deploy.sh\", \"/tmp/deploy.sh\"]" \
            --query "Command.CommandId" --output text)

          echo "Waiting for command $COMMAND_ID to finish..."
          aws ssm wait command-executed \
            --region "${{ inputs.aws_region }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "$(echo $INSTANCE_IDS | cut -d' ' -f1)" || true

          for id in $INSTANCE_IDS; do
            echo "--- Output for $id ---"
            aws ssm get-command-invocation \
              --region "${{ inputs.aws_region }}" \
              --command-id "$COMMAND_ID" \
              --instance-id "$id"
          done