name: chat-fe - Build, Push & Update Helm values

on:
  push:
    branches: [dev.01]
    paths:
      - "chat-fe/**"
      - "helm/chat-fe/**"
      - ".github/workflows/chat-fe.yml"
      - ".github/workflows/_build-push-ecr.yml"
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    uses: ./.github/workflows/_build-push-ecr.yml
    with:
      service_name: "chat-fe"
      context_path: "chat-fe"
      dockerfile: "chat-fe/Dockerfile"
      ecr_repository: "chat-fe"
      aws_region: "us-east-1"
      helm_values_path: "helm/chat-fe/values.yaml"
      gitops_branch: "dev.01"
    secrets:
      AWS_ROLE_EKS_ARN: ${{ secrets.AWS_ROLE_EKS_ARN }}
