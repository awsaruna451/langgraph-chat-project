name: mcp-cal-server - Build & Deploy

on:
  push:
    branches: [dev]
    paths:
      - "mcp-cal-server/**"
      - ".github/workflows/mcp-cal-server.yml"
      - ".github/workflows/_build-push-ecr.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # required so the caller can grant this to the reusable workflow
  contents: read

jobs:
  build-and-push:
    uses: ./.github/workflows/_build-push-ecr.yml
    with:
      service_name: "mcp-cal-server"
      context_path: "mcp-cal-server"
      dockerfile: "mcp-cal-server/Dockerfile"
      ecr_repository: "mcp-server"
      aws_region: "us-east-1"
      environment: "dev"     # ← confirm this matches var.environment in main.tf
      container_port: "8080"  # ← PLACEHOLDER: replace with mcp-cal-server's actual listening port
      secret_name: "ai-agent-platform-prod-secrets"  # ← confirm this matches your actual secret name; omit this line if mcp-cal-server needs no secrets
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}