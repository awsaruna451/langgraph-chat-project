name: mcp-cal-server - Build & Deploy
on:
  push:
    branches: [dev]
    paths:
      - "mcp-cal-server/**"
      - ".github/workflows/mcp-cal-server.yml"
      - ".github/workflows/_build-push-ecr.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # required so the caller can grant this to the reusable workflow
  contents: read

jobs:
  build-and-push:
    uses: ./.github/workflows/_build-push-ecr.yml
    with:
      service_name: "mcp-cal-server"
      context_path: "mcp-cal-server"
      dockerfile: "mcp-cal-server/Dockerfile"
      ecr_repository: "mcp-server"
      aws_region: "us-east-1"
      environment: "dev"
      host_port: "8000"
      container_port: "8000"  # ← confirm mcp-cal-server's actual internal listening port
      secret_name: "ai-agent-platform-dev-secrets"
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}