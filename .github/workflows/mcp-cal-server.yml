name: mcp-cal-server - Build, Push & Update Helm values

on:
  push:
    branches: [dev.01]
    paths:
      - "mcp-cal-server/**"
      - "helm/mcp-server/**"
      - ".github/workflows/mcp-cal-server.yml"
      - ".github/workflows/_build-push-ecr.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    uses: ./.github/workflows/_build-push-ecr.yml
    with:
      service_name: "mcp-cal-server"
      context_path: "mcp-cal-server"
      dockerfile: "mcp-cal-server/Dockerfile"
      ecr_repository: "mcp-server"
      aws_region: "us-east-1"
      helm_values_path: "helm/mcp-server/values.yaml"
      gitops_branch: "dev.01"   # confirm: the branch ArgoCD's Application tracks for this chart
    secrets:
      AWS_ROLE_EKS_ARN: ${{ secrets.AWS_ROLE_EKS_ARN }}
