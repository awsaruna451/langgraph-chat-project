name: chat-be - Build & Deployment
on:
  push:
    branches: [dev]
    paths:
      - "chat-be/**"
      - ".github/workflows/chat-be.yml"
      - ".github/workflows/_build-push-ecr.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # required so the caller can grant this to the reusable workflow
  contents: read

jobs:
  build-and-push:
    uses: ./.github/workflows/_build-push-ecr.yml
    with:
      service_name: "chat-be"
      context_path: "chat-be"
      dockerfile: "chat-be/Dockerfile"
      ecr_repository: "ai-agent"
      aws_region: "us-east-1"
      environment: "dev"
      host_port: "8001"
      container_port: "8000"  # ← confirm chat-be's actual internal listening port (uvicorn/fastapi default shown here)
      secret_name: "ai-agent-platform-dev-secrets"
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}