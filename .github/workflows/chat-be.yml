name: chat-be - Build, Push & Update Helm values

on:
  push:
    branches: [dev.01]
    paths:
      - "chat-be/**"
      - "helm/chat-be/**"
      - ".github/workflows/chat-be.yml"
      - ".github/workflows/_build-push-ecr.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    uses: ./.github/workflows/_build-push-ecr.yml
    with:
      service_name: "chat-be"
      context_path: "chat-be"
      dockerfile: "chat-be/Dockerfile"
      ecr_repository: "chat-be"
      aws_region: "us-east-1"
      helm_values_path: "helm/chat-be/values.yaml"
      gitops_branch: "dev.01"   # confirm: the branch ArgoCD's Application tracks for this chart
    secrets:
      AWS_ROLE_EKS_ARN: ${{ secrets.AWS_ROLE_EKS_ARN }}
