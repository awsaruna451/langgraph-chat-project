name: chat-be - Build & Deploy

on:
  push:
    branches: [dev]
    paths:
      - "chat-be/**"
      - ".github/workflows/chat-be.yml"
      - ".github/workflows/_build-push-ecr.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # required so the caller can grant this to the reusable workflow
  contents: read

jobs:
  build-and-push:
    uses: ./.github/workflows/_build-push-ecr.yml
    with:
      service_name: "chat-be"
      context_path: "chat-be"
      dockerfile: "chat-be/Dockerfile"
      ecr_repository: "ai-agent"
      aws_region: "us-east-1"
      environment: "dev"     # ← confirm this matches var.environment in main.tf
      container_port: "8000"  # ← PLACEHOLDER: replace with chat-be's actual listening port
      secret_name: "ai-agent-platform-prod-secrets"  # ← confirm this matches your actual secret name
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}